    <meta name="description" content="ระบบสแกนใบหน้าบันทึกเวลาเข้า-ออกงาน จัดเก็บคุณลักษณะชีวมิติเรขาคณิตใบหน้าเป็นแฮชเข้ารหัส (Encrypted Biometric Hash) ป้องกันการสแกนแทนและคุ้มครองความเป็นส่วนตัวตามมาตรฐาน PDPA พร้อมคำนวณเงินเดือนอัตโนมัติและออกสลิปเงินเดือน" />
    <meta property="og:title" content="MK FaceTimePay - ระบบสแกนหน้าเข้างานและคิดเงินเดือน" />
    <meta property="og:description" content="ระบบสแกนใบหน้าบันทึกเวลาเข้า-ออกงาน จัดเก็บคุณลักษณะชีวมิติเรขาคณิตใบหน้าเป็นแฮชเข้ารหัส (Encrypted Biometric Hash) ป้องกันการสแกนแทนและคุ้มครองความเป็นส่วนตัวตามมาตรฐาน PDPA พร้อมคำนวณเงินเดือนอัตโนมัติและออกสลิปเงินเดือน" />

    <script>
      (function() {
        // Intercept and suppress benign Vite dev-server HMR websocket messages
        window.addEventListener('unhandledrejection', function(event) {
          var str = String(event.reason && (event.reason.message || event.reason) || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var str = String(event.message || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullText = args.map(function(a) { return String(a && (a.message || a) || ''); }).join(' ');
          if (fullText.indexOf('WebSocket') !== -1 || fullText.indexOf('websocket') !== -1 || fullText.indexOf('[vite] failed to connect') !== -1) {
            return;
          }
          originalConsoleError.apply(console, arguments);
        };

        var originalConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullText = args.map(function(a) { return String(a && (a.message || a) || ''); }).join(' ');
          if (fullText.indexOf('WebSocket') !== -1 || fullText.indexOf('websocket') !== -1 || fullText.indexOf('[vite] failed to connect') !== -1) {
            return;
          }
          originalConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
